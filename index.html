<style>
:root {
  --bg: #0D1117; --card: #161B22; --card2: #1C2128; --border: #21262D;
  --text: #F0F6FC; --muted: #8B949E; --dim: #6E7681;
  --orange: #E87722; --orangeL: #FF9A4D; --green: #3FB950; --red: #F85149;
  --yellow: #D29922; --blue: #58A6FF; --teal: #00D4BC; --purple: #BC8CFF;
  --tealDk: #00B4A0; --yellowL: #E8B931;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
button { font-family:inherit; cursor:pointer; }
input,textarea { font-family:inherit; }
.root { max-width:1440px; margin:0 auto; padding:16px; }

/* Header */
.hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.logo { width:42px; height:42px; background:linear-gradient(135deg,var(--orange),var(--orangeL)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:#fff; box-shadow:0 3px 14px rgba(232,119,34,0.3); flex-shrink:0; }
.bdg { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:14px; font-size:10px; font-weight:600; font-family:'JetBrains Mono',monospace; }

/* Stats row */
.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:12px; }
.stat-box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.stat-lbl { font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:3px; }
.stat-val { font-size:22px; font-weight:700; letter-spacing:-1px; }
.stat-unit { font-size:11px; font-weight:400; color:var(--muted); }

/* Cards */
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }

/* View tabs */
.vtabs { display:flex; gap:3px; margin-bottom:10px; background:var(--card); border-radius:8px; padding:3px; border:1px solid var(--border); }
.vtab { flex:1; padding:8px 10px; border-radius:6px; font-size:12px; font-weight:600; border:none; color:var(--muted); background:transparent; transition:all .15s; }
.vtab.on { color:var(--orangeL); background:rgba(232,119,34,0.12); }

/* Filters */
.filters { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.search { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px; outline:none; min-width:120px; }
.fbtn { padding:4px 9px; border-radius:5px; font-size:10px; font-weight:600; border:1px solid transparent; color:var(--muted); background:rgba(255,255,255,0.04); transition:all .15s; }
.fbtn.on { background:rgba(232,119,34,0.12); color:var(--orangeL); border-color:rgba(232,119,34,0.3); }
.fbtn.gon { background:rgba(63,185,80,0.12); color:var(--green); border-color:rgba(63,185,80,0.3); }

/* Council row */
.crow { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card2); border-radius:8px; border:2px solid transparent; transition:all .15s; margin-bottom:3px; }
.crow.sel { box-shadow:0 0 0 1px rgba(255,255,255,0.1); }
.chk { width:18px; height:18px; border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid var(--dim); background:transparent; cursor:pointer; font-size:9px; font-weight:800; color:#000; }
.chk.on { border:none; }
.tag { font-size:9px; font-weight:600; padding:2px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace; display:inline-block; white-space:nowrap; }
.dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.arrow-btn { width:28px; height:28px; border-radius:6px; border:none; background:rgba(255,255,255,0.06); color:var(--muted); font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* Detail */
.back-btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:12px; font-weight:600; }
.dtag { font-size:10px; font-weight:600; padding:2px 8px; border-radius:5px; font-family:'JetBrains Mono',monospace; }
.stage-btn { padding:5px 12px; border-radius:6px; font-size:11px; border:1px solid transparent; background:transparent; color:var(--dim); }
.stage-btn.on { font-weight:700; }
.tabs { display:flex; gap:2px; margin-bottom:10px; background:var(--card); border-radius:8px; padding:2px; border:1px solid var(--border); flex-wrap:wrap; }
.tab { padding:7px 10px; border-radius:5px; font-size:11px; font-weight:600; border:none; color:var(--muted); background:transparent; white-space:nowrap; }
.tab.on { background:rgba(232,119,34,0.12); color:var(--orangeL); }
.lbl { font-size:9px; font-family:'JetBrains Mono',monospace; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:3px; }
.val { font-size:13px; color:var(--text); }
.grid4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.empty { text-align:center; padding:40px 16px; }
.footer { text-align:center; padding:16px 0 6px; color:var(--dim); font-size:9px; font-family:'JetBrains Mono',monospace; }

/* Action items */
.act-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:var(--card2); border-radius:6px; margin-bottom:3px; border:1px solid var(--border); cursor:pointer; transition:opacity .15s; }
.act-chk { width:18px; height:18px; border-radius:4px; border:2px solid var(--dim); background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; font-size:10px; font-weight:800; color:#000; }
.act-chk.done { background:var(--blue); border-color:var(--blue); }
.progress { height:5px; background:rgba(255,255,255,0.06); border-radius:3px; margin-bottom:14px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; transition:width .3s; }

/* Tracker */
.tracker-cols { display:flex; gap:8px; overflow-x:auto; }
.tracker-col { flex:1; min-width:160px; background:var(--card2); border-radius:8px; padding:10px; }
.tracker-card { background:var(--card); border-radius:6px; padding:8px; margin-bottom:4px; border:1px solid var(--border); cursor:pointer; }

/* Notes */
.notes-ta { width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; resize:vertical; outline:none; line-height:1.6; min-height:280px; }

/* Selected view action btns */
.sm-btn { padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; }

/* Responsive */
@media(max-width:900px) {
  .stats { grid-template-columns:repeat(3,1fr); }
  .grid4 { grid-template-columns:1fr 1fr; }
}
@media(max-width:600px) {
  .stats { grid-template-columns:repeat(2,1fr); }
  .grid4,.grid2 { grid-template-columns:1fr; }
}

/* Animate in */
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.fade-up { animation: fadeUp .25s ease both; }

/* Sync indicator */
.sync-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
.sync-bar { display:flex; align-items:center; gap:4px; font-size:9px; font-family:'JetBrains Mono',monospace; color:var(--dim); padding:4px 10px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.syncing .sync-dot { animation: pulse 1s infinite; }
</style>

function getActions(c,stage){
  const st=stage||"prospect",s=c.solution;
  if(st==="prospect"){const b=[{text:"Download "+c.name+" strategy documents (see Strategy Docs tab)"},{text:"Identify Sustainability Officer / Asset Manager at "+c.name},{text:"Research "+c.name+" net-zero / renewable energy targets"}];if(s==="full")return[...b,{text:"Confirm whether "+c.name+" has any unlisted solar"},{text:"Prepare tailored City of Yarra case study for turnkey delivery"},{text:"Build preliminary ROI model: 200kW solar + 100kWh battery across "+c.estFacilities+" facilities"}];if(s==="hybrid")return[...b,{text:"Map which facilities already have solar and which don't"},{text:"Estimate gap: additional solar capacity needed for viable VPP"},{text:"Prepare hybrid pitch: upgrade + fill gaps + connect with SwitchDin"}];return[...b,{text:"Audit existing solar assets \u2014 system sizes, inverter brands, monitoring"},{text:"Check inverter compatibility with SwitchDin Droplet"},{text:"Prepare VPP-only pitch: your solar is underperforming without coordination"}];}
  if(st==="outreach")return[{text:"Send personalised email referencing their specific targets/strategies"},{text:"Include link to SwitchDin City of Yarra case study"},{text:"Follow up by phone 3 business days after email"},{text:"Connect with key contacts on LinkedIn"},{text:"If no response after 5 days, send follow-up with different angle"}];
  if(st==="meeting")return[{text:"Prepare presentation: City of Yarra \u2192 "+c.name+" opportunity \u2192 proposed solution"},{text:"Print one-page leave-behind with "+c.name+"-specific estimated savings"},{text:"Meeting: Ask First (10m) \u2192 Present Model (15m) \u2192 Local Fit (10m) \u2192 Next Steps (5m)"},{text:"Ask: What are your current energy costs across all facilities?"},{text:"Ask: What sustainability targets has council committed to, and by when?"},{text:"Offer free energy audit of 2-3 key facilities"}];
  if(st==="proposal")return[{text:"Complete energy audit of key facilities"},{text:"Deliver technical proposal: system sizing, battery spec, SwitchDin deployment"},{text:"Include financial model: savings, payback, 10yr and 20yr ROI"},{text:"Identify grants: ARENA, CEFC, WA Clean Energy Future Fund"},{text:"Propose pilot: 1-2 facilities first, then scale"}];
  if(st==="negotiation")return[{text:"Clarify procurement process \u2014 direct engagement threshold vs tender"},{text:"If tender: help draft scope of works for community energy VPP"},{text:"Arrange SwitchDin technical call if needed"},{text:"Prepare final pricing: upfront purchase vs PPA structure"},{text:"Get written confirmation of pilot scope and timeline"}];
  return[{text:"Contract signed!"},{text:"Kick off: site surveys, detailed design, procurement"},{text:"Coordinate SwitchDin Droplet delivery and Stormcloud setup"},{text:"Plan community dashboard launch event"},{text:"Document project for case study \u2014 use for next council pitch"}];
}

let dbRef = null;

try {
  if(typeof firebase !== "undefined" && firebase.initializeApp) {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref("pipeline/v1");
    useFirebase = true;
  }
} catch(e) { useFirebase = false; }

let syncStatus = useFirebase ? "connecting" : "local";

// ─── STATE ───
let state={selected:new Set(),stages:{},notes:{},actionsDone:{},fSol:"all",fPri:"all",fRes:"all",search:"",view:"pipeline",activeId:null,tab:"overview"};
let saving = false;

// Load from localStorage as initial/fallback
try {
  const d = JSON.parse(localStorage.getItem(SK));
  if(d){
    if(d.selected) state.selected = new Set(d.selected);
    if(d.stages) state.stages = d.stages;
    if(d.notes) state.notes = d.notes;
    if(d.actionsDone) state.actionsDone = d.actionsDone;
  }
} catch(e){}

function save(){
  // Always save to localStorage as backup
  try { localStorage.setItem(SK, JSON.stringify({selected:[...state.selected],stages:state.stages,notes:state.notes,actionsDone:state.actionsDone})); } catch(e){}

  if(!useFirebase || !dbRef) return;
  saving = true;
  syncStatus = "saving";
  renderSyncBadge();
  dbRef.set({
    selected:[...state.selected],
    stages:state.stages,
    notes:state.notes,
    actionsDone:state.actionsDone
  }).then(()=>{
    syncStatus = "live";
    saving = false;
    renderSyncBadge();
  }).catch(()=>{
    syncStatus = "offline";
    saving = false;
    renderSyncBadge();
  });
}

function renderSyncBadge(){
  const el = document.getElementById("sync-badge");
  if(!el) return;
  const colors = {live:"#3FB950",saving:"#D29922",connecting:"#58A6FF",offline:"#F85149",local:"#8B949E"};
  const labels = {live:"Live \u2022 Synced",saving:"Saving...",connecting:"Connecting...",offline:"Offline",local:"Local Only"};
  el.className = "sync-bar" + (syncStatus==="saving"?" syncing":"");
  el.innerHTML = '<span class="sync-dot" style="background:'+colors[syncStatus]+'"></span>' + labels[syncStatus];
}

// Listen for real-time changes from Firebase (if available)
if(useFirebase && dbRef) {
  dbRef.on("value", (snapshot) => {
    if(saving) return;
    const d = snapshot.val();
    if(d){
      if(d.selected) state.selected = new Set(d.selected);
      if(d.stages) state.stages = d.stages;
      if(d.notes) state.notes = d.notes;
      if(d.actionsDone) state.actionsDone = d.actionsDone;
    }
    syncStatus = "live";
    render();
  }, () => {
    syncStatus = "offline";
    renderSyncBadge();
  });
}

// ─── HELPERS ───
const h=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const solClr=(s)=>SOL[s]||SOL.full;
const priClr=(p)=>p===1?{bg:"rgba(232,119,34,0.15)",c:"#FF9A4D"}:p===2?{bg:"rgba(210,153,34,0.12)",c:"#D29922"}:{bg:"rgba(88,166,255,0.1)",c:"#58A6FF"};
const dotClr=(l)=>l==="confirmed"?"#3FB950":l==="partial"?"#D29922":"#F85149";
const statusClr=(s)=>s==="overdue"?"#F85149":s==="active"?"#3FB950":"#D29922";
const selCs=()=>COUNCILS.filter(c=>state.selected.has(c.id));
const getStats=()=>{const s=selCs();return{count:s.length,min:s.reduce((a,c)=>a+c.valueMin,0),max:s.reduce((a,c)=>a+c.valueMax,0),full:s.filter(c=>c.solution==="full").length,hybrid:s.filter(c=>c.solution==="hybrid").length,droplet:s.filter(c=>c.solution==="droplet").length};};
const filtered=()=>COUNCILS.filter(c=>{if(state.fSol!=="all"&&c.solution!==state.fSol)return false;if(state.fPri!=="all"&&c.priority!==+state.fPri)return false;if(state.fRes==="yes"&&!c.researchDone)return false;if(state.fRes==="no"&&c.researchDone)return false;if(state.search&&!c.name.toLowerCase().includes(state.search.toLowerCase()))return false;return true;});

function toggle(id){if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);save();render();}
function setStage(id,s){state.stages[id]=s;save();render();}
function setNote(id,t){state.notes[id]=t;clearTimeout(setNote._t);setNote._t=setTimeout(save,800);}
setNote._t=null;
function toggleAct(cid,idx){const k=cid+"-"+(state.stages[cid]||"prospect")+"-"+idx;state.actionsDone[k]=!state.actionsDone[k];save();render();}
function openDetail(id,t){state.activeId=id;state.tab=t||"overview";render();}
function closeDetail(){state.activeId=null;render();}
function setView(v){state.view=v;render();}
function setTab(t){state.tab=t;render();}
function setFilter(k,v){state[k]=v;render();}

function render(){
  const app=document.getElementById("app");
  const st=getStats();
  const ac=state.activeId?COUNCILS.find(c=>c.id===state.activeId):null;

  if(ac) { app.innerHTML=renderDetail(ac,st); wireDetail(ac); return; }
  app.innerHTML=renderMain(st);
  wireMain();
}

  const vts=[{k:"pipeline",l:"All Councils"},{k:"selected",l:"Selected ("+st.count+")"},{k:"tracker",l:"Tracker"}];

  if(ac.reclassified)o+=`<div style="padding:12px;background:rgba(232,119,34,0.08);border-radius:8px;border:1px solid rgba(232,119,34,0.2);margin-bottom:12px;font-size:12px"><span style="font-weight:700;color:var(--orangeL)">\u26A0 RECLASSIFIED:</span> <span style="color:#C9D1D9">Changed from <b>${h(ac.reclassifiedFrom)}</b> \u2192 <b>${h(ac.reclassifiedTo)}</b>. Reason: ${h(ac.reclassifiedReason)}</span></div>`;
  // Stage bar
  o+=`<div style="display:flex;gap:3px;margin-bottom:12px;flex-wrap:wrap">${STAGES.map(s=>`<button class="stage-btn${stage===s.key?" on":""}" style="${stage===s.key?"border-color:"+s.color+"44;background:"+s.color+"22;color:"+s.color+";font-weight:700":""}" onclick="setStage(${ac.id},'${s.key}')">${s.icon} ${s.label}</button>`).join("")}</div>`;
  // Tabs
  const tabs=[{k:"overview",l:"Overview"},{k:"findings",l:"Research"},{k:"docs",l:"Strategy Docs"},{k:"contacts",l:"Contacts"},{k:"pitch",l:"Sales Pitch"},{k:"actions",l:"Actions"},{k:"notes",l:"Notes"}];
  o+=`<div class="tabs">${tabs.map(t=>`<button class="tab${state.tab===t.k?" on":""}" onclick="setTab('${t.k}')">${t.l}</button>`).join("")}</div>`;
  o+=`<div class="card">`;
  if(state.tab==="overview") o+=renderOverview(ac,sc);
  else if(state.tab==="findings") o+=renderFindings(ac);
  else if(state.tab==="docs") o+=renderDocs(ac);
  else if(state.tab==="contacts") o+=renderContacts(ac);
  else if(state.tab==="pitch") o+=renderPitch(ac,sc);
  else if(state.tab==="actions") o+=renderActions(ac,actions,stage,stObj);
  else if(state.tab==="notes") o+=renderNotes(ac);
  o+=`</div><div class="footer">NOOR ENERGY \u00D7 SWITCHDIN \u2014 ${h(ac.name)} \u2014 Pipeline Manager</div>`;
  return o;
}

function renderOverview(c,sc){
  let o=`<div class="grid4"><div><div class="lbl">Phone</div><div class="val">${h(c.phone)}</div></div><div><div class="lbl">Email</div><div class="val" style="word-break:break-all">${h(c.email)}</div></div><div><div class="lbl">Region</div><div class="val">${c.region}</div></div><div><div class="lbl">Est. Facilities</div><div class="val">${c.estFacilities}</div></div><div><div class="lbl">Current Solar</div><div class="val" style="display:flex;align-items:center;gap:6px"><span class="dot" style="width:8px;height:8px;background:${dotClr(c.solarLevel)}"></span>${h(c.solar)}</div></div><div><div class="lbl">Est. Capacity</div><div class="val">${c.estKw>0?"~"+c.estKw+" kW":"None identified"}</div></div><div><div class="lbl">Solution Track</div><div class="val" style="color:${sc.text}">${sc.icon} ${sc.label}</div></div><div><div class="lbl">Approach</div><div class="val">${h(c.approach)}</div></div></div>`;
  if(c.facilities.length)o+=`<div style="margin-top:16px"><div class="lbl">Known Facilities</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${c.facilities.map(f=>`<span style="padding:4px 10px;border-radius:5px;background:rgba(255,255,255,0.06);font-size:12px;color:var(--muted)">${h(f)}</span>`).join("")}</div></div>`;
  if(c.targets.length){o+=`<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)"><div class="lbl" style="margin-bottom:8px">Published Targets</div>`;c.targets.forEach(t=>{o+=`<div style="padding:10px;background:${t.status==="overdue"?"rgba(248,81,73,0.06)":"rgba(255,255,255,0.02)"};border-radius:6px;margin-bottom:6px;border-left:3px solid ${statusClr(t.status)}"><div style="font-size:13px;font-weight:600">${h(t.target)}</div><div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap"><span style="font-size:11px;font-family:'JetBrains Mono',monospace;color:${t.status==="overdue"?"var(--red)":"var(--muted)"}">Deadline: ${t.deadline}</span><span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:${statusClr(t.status)}22;color:${statusClr(t.status)}">${t.status.toUpperCase()}</span></div>${t.note?`<div style="font-size:11px;color:var(--orangeL);margin-top:4px;font-style:italic">${h(t.note)}</div>`:""}</div>`;});o+=`</div>`;}
  return o;
}

function renderFindings(c){
  if(!c.researchDone)return`<div class="empty"><div style="font-size:16px;font-weight:600">Research not yet completed</div><div style="color:var(--muted);font-size:13px;margin-top:4px">This council hasn\u2019t been researched yet.</div></div>`;
  let o=`<div style="font-size:15px;font-weight:700;margin-bottom:12px">Key Research Findings</div>`;
  c.keyFindings.forEach(f=>{o+=`<div style="padding:10px;background:rgba(255,255,255,0.02);border-radius:6px;margin-bottom:4px;font-size:13px;line-height:1.5;border-left:3px solid var(--border)">${h(f)}</div>`;});
  if(c.pitchAngle)o+=`<div style="margin-top:16px;padding:14px;background:rgba(232,119,34,0.06);border-radius:8px;border:1px solid rgba(232,119,34,0.15)"><div style="font-size:12px;font-weight:700;color:var(--orangeL);margin-bottom:6px">Recommended Pitch Angle</div><div style="font-size:13px;color:#C9D1D9;line-height:1.6;font-style:italic">${h(c.pitchAngle)}</div></div>`;
  return o;
}

function renderDocs(c){
  if(!c.strategyDocs.length)return`<div class="empty"><div style="font-size:16px;font-weight:600">No strategy documents catalogued yet</div><div style="color:var(--muted);font-size:13px;margin-top:4px">Research this council\u2019s website to find their sustainability plans.</div></div>`;
  let o=`<div style="font-size:15px;font-weight:700;margin-bottom:4px">Strategy Documents to Download</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px">Download these before your first outreach</div>`;
  c.strategyDocs.forEach(d=>{o+=`<div style="padding:12px;background:${d.priority?"rgba(232,119,34,0.04)":"rgba(255,255,255,0.02)"};border-radius:8px;margin-bottom:6px;border:${d.priority?"1px solid rgba(232,119,34,0.15)":"1px solid var(--border)"}"><div style="display:flex;align-items:center;gap:6px">${d.priority?`<span class="tag" style="background:rgba(232,119,34,0.15);color:var(--orangeL)">PRIORITY</span>`:""}<span style="font-size:14px;font-weight:600">${h(d.name)}</span></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${h(d.date)}</div><div style="font-size:12px;color:var(--blue);margin-top:4px;font-family:'JetBrains Mono',monospace">${h(d.url)}</div>${d.note?`<div style="font-size:11px;color:var(--yellow);margin-top:4px;font-style:italic">${h(d.note)}</div>`:""}</div>`;});
  return o;
}

function renderContacts(c){
  if(!c.contacts.length)return`<div class="empty"><div style="font-size:16px;font-weight:600">No contacts identified yet</div><div style="color:var(--muted);font-size:13px;margin-top:4px">Search LinkedIn for sustainability staff at this council.</div></div>`;
  let o=`<div style="font-size:15px;font-weight:700;margin-bottom:12px">Identified Contacts</div>`;
  c.contacts.forEach(ct=>{o+=`<div style="padding:12px;background:${ct.priority?"rgba(63,185,80,0.04)":"rgba(255,255,255,0.02)"};border-radius:8px;margin-bottom:6px;border:${ct.priority?"1px solid rgba(63,185,80,0.15)":"1px solid var(--border)"}"><div style="display:flex;align-items:center;gap:6px">${ct.priority?`<span class="tag" style="background:rgba(63,185,80,0.15);color:var(--green)">PRIMARY</span>`:""}<span style="font-size:14px;font-weight:600">${h(ct.role)}</span></div><div style="font-size:13px;margin-top:4px">${h(ct.name)}</div><div style="font-size:12px;color:var(--muted);margin-top:2px">${h(ct.method)}</div>${ct.note?`<div style="font-size:11px;color:var(--yellow);margin-top:4px;font-style:italic">${h(ct.note)}</div>`:""}</div>`;});
  o+=`<div style="margin-top:12px;padding:12px;background:rgba(88,166,255,0.06);border-radius:8px;border:1px solid rgba(88,166,255,0.12)"><div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px">General Contact</div><div style="font-size:13px">Phone: ${h(c.phone)}</div><div style="font-size:13px">Email: ${h(c.email)}</div></div>`;
  return o;
}

function renderPitch(c,sc){
  if(!c.pitchAngle)return`<div class="empty"><div style="font-size:16px;font-weight:600">Pitch not prepared yet</div><div style="color:var(--muted);font-size:13px;margin-top:4px">Complete research first to generate a tailored pitch.</div></div>`;
  const qs=c.solution==="droplet"?["How many facilities have solar, and what are the total capacities?","What inverter brands and models are installed?","Do you have any monitoring or energy management platform?","What % of solar is being exported vs self-consumed?","Have you explored energy sharing between buildings?","What are your top 3 energy priorities for the next 12 months?"]:c.solution==="hybrid"?["Which facilities currently have solar, and what sizes?","What inverter brands are installed?","Which facilities without solar have the highest energy bills?","What\u2019s your annual energy spend across all facilities?","Are you satisfied with your existing solar performance?","What sustainability targets has council committed to?"]:["What are your current annual electricity costs across all facilities?","Which facilities have the highest energy consumption?","Has council set specific renewable energy / net-zero targets?","Are there any existing solar installations we should know about?","What is your procurement process for this value range?","Are you pursuing any state or federal grant opportunities?"];
  let o=`<div style="padding:16px;background:${sc.bg};border-radius:10px;border:1px solid ${sc.border};margin-bottom:20px"><div style="font-size:20px;font-weight:700;color:${sc.text}">Pitch for ${h(c.name)}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${sc.icon} ${sc.label} \u2014 powered by Noor Energy \u00D7 SwitchDin</div></div>`;
  o+=`<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">Recommended Pitch Angle</div><div style="padding:14px;background:rgba(0,0,0,0.15);border-radius:8px;font-size:13px;color:#C9D1D9;line-height:1.6;font-style:italic;border-left:3px solid ${sc.text}">${h(c.pitchAngle)}</div></div>`;
  if(c.targets.length){o+=`<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">Their Published Targets \u2014 Reference These</div>`;c.targets.forEach(t=>{o+=`<div style="padding:10px;margin-bottom:4px;border-radius:6px;background:${t.status==="overdue"?"rgba(248,81,73,0.06)":"rgba(255,255,255,0.02)"};border-left:3px solid ${t.status==="overdue"?"var(--red)":"var(--yellow)"}"><div style="font-size:13px;font-weight:600">${h(t.target)} \u2014 by ${t.deadline}</div>${t.note?`<div style="font-size:11px;color:var(--orangeL);margin-top:2px">${h(t.note)}</div>`:""}</div>`;});o+=`</div>`;}
  o+=`<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">Discovery Questions \u2014 Ask in First Meeting</div>${qs.map((q,i)=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:rgba(88,166,255,0.04);border-radius:6px;margin-bottom:4px;border:1px solid rgba(88,166,255,0.08)"><span style="color:var(--blue);font-weight:700;font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0">Q${i+1}</span><span style="font-size:13px">${h(q)}</span></div>`).join("")}</div>`;
  o+=`<div style="padding:14px;background:rgba(0,180,160,0.06);border-radius:8px;border:1px solid rgba(0,180,160,0.12)"><div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:4px">City of Yarra Reference</div><div style="font-size:12px;color:var(--muted);line-height:1.5">SwitchDin\u2019s Droplet + Stormcloud deployed across council facilities. Solar energy sharing via VPP. ~200kW solar, ~$85K/yr savings, ~240t CO\u2082/yr. Perth\u2019s 35% higher solar yield means ${h(c.name)} sees even better results.</div></div>`;
  return o;
}

function renderActions(c,actions,stage,stObj){
  const doneCount=actions.filter((_,i)=>state.actionsDone[c.id+"-"+stage+"-"+i]).length;
  const pct=Math.round(doneCount/actions.length*100);
  let o=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-size:15px;font-weight:700">${stObj.icon} ${stObj.label} Stage Actions</div><div style="font-size:12px;color:var(--muted);margin-top:2px">Complete before moving to next stage</div></div><div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${stObj.color}">${doneCount}/${actions.length}</div></div><div class="progress"><div class="progress-fill" style="background:${stObj.color};width:${pct}%"></div></div>`;
  actions.forEach((a,i)=>{const done=state.actionsDone[c.id+"-"+stage+"-"+i];o+=`<div class="act-row" style="opacity:${done?0.5:1}" onclick="toggleAct(${c.id},${i})"><div class="act-chk${done?" done":""}" style="${done?"background:"+stObj.color+";border-color:"+stObj.color:""}">${done?"\u2713":""}</div><span style="text-decoration:${done?"line-through":"none"};font-size:13px;line-height:1.4">${h(a.text)}</span></div>`;});
  return o;
}

function renderNotes(c){
  return`<div style="font-size:15px;font-weight:700;margin-bottom:4px">Notes for ${h(c.name)}</div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">Meeting notes, follow-ups, contact details \u2014 synced live across all devices</div><textarea class="notes-ta" id="notes-ta" placeholder="Add notes about ${h(c.name)}...">${h(state.notes[c.id]||"")}</textarea>`;
}

function wireDetail(ac){
  const ta=document.getElementById("notes-ta");
  if(ta)ta.addEventListener("input",function(){setNote(ac.id,this.value);});
}
function wireMain(){}

render();
</script>
</body>
</html>
