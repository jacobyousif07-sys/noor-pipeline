<style>
:root {
  --bg: #0D1117; --card: #161B22; --card2: #1C2128; --border: #21262D;
  --text: #F0F6FC; --muted: #8B949E; --dim: #6E7681;
  --orange: #E87722; --orangeL: #FF9A4D; --green: #3FB950; --red: #F85149;
  --yellow: #D29922; --blue: #58A6FF; --teal: #00D4BC; --purple: #BC8CFF;
  --tealDk: #00B4A0; --yellowL: #E8B931;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
button { font-family:inherit; cursor:pointer; }
input,textarea { font-family:inherit; }
.root { max-width:1440px; margin:0 auto; padding:16px; }

/* Header */
.hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.logo { width:42px; height:42px; background:linear-gradient(135deg,var(--orange),var(--orangeL)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:#fff; box-shadow:0 3px 14px rgba(232,119,34,0.3); flex-shrink:0; }
.bdg { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:14px; font-size:10px; font-weight:600; font-family:'JetBrains Mono',monospace; }

/* Stats row */
.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:12px; }
.stat-box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.stat-lbl { font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:3px; }
.stat-val { font-size:22px; font-weight:700; letter-spacing:-1px; }
.stat-unit { font-size:11px; font-weight:400; color:var(--muted); }

/* Cards */
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }

/* View tabs */
.vtabs { display:flex; gap:3px; margin-bottom:10px; background:var(--card); border-radius:8px; padding:3px; border:1px solid var(--border); }
.vtab { flex:1; padding:8px 10px; border-radius:6px; font-size:12px; font-weight:600; border:none; color:var(--muted); background:transparent; transition:all .15s; }
.vtab.on { color:var(--orangeL); background:rgba(232,119,34,0.12); }

/* Filters */
.filters { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.search { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px; outline:none; min-width:120px; }
.fbtn { padding:4px 9px; border-radius:5px; font-size:10px; font-weight:600; border:1px solid transparent; color:var(--muted); background:rgba(255,255,255,0.04); transition:all .15s; }
.fbtn.on { background:rgba(232,119,34,0.12); color:var(--orangeL); border-color:rgba(232,119,34,0.3); }
.fbtn.gon { background:rgba(63,185,80,0.12); color:var(--green); border-color:rgba(63,185,80,0.3); }

/* Council row */
.crow { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card2); border-radius:8px; border:2px solid transparent; transition:all .15s; margin-bottom:3px; }
.crow.sel { box-shadow:0 0 0 1px rgba(255,255,255,0.1); }
.chk { width:18px; height:18px; border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid var(--dim); background:transparent; cursor:pointer; font-size:9px; font-weight:800; color:#000; }
.chk.on { border:none; }
.tag { font-size:9px; font-weight:600; padding:2px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace; display:inline-block; white-space:nowrap; }
.dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.arrow-btn { width:28px; height:28px; border-radius:6px; border:none; background:rgba(255,255,255,0.06); color:var(--muted); font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* Detail */
.back-btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:12px; font-weight:600; }
.dtag { font-size:10px; font-weight:600; padding:2px 8px; border-radius:5px; font-family:'JetBrains Mono',monospace; }
.stage-btn { padding:5px 12px; border-radius:6px; font-size:11px; border:1px solid transparent; background:transparent; color:var(--dim); }
.stage-btn.on { font-weight:700; }
.tabs { display:flex; gap:2px; margin-bottom:10px; background:var(--card); border-radius:8px; padding:2px; border:1px solid var(--border); flex-wrap:wrap; }
.tab { padding:7px 10px; border-radius:5px; font-size:11px; font-weight:600; border:none; color:var(--muted); background:transparent; white-space:nowrap; }
.tab.on { background:rgba(232,119,34,0.12); color:var(--orangeL); }
.lbl { font-size:9px; font-family:'JetBrains Mono',monospace; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:3px; }
.val { font-size:13px; color:var(--text); }
.grid4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.empty { text-align:center; padding:40px 16px; }
.footer { text-align:center; padding:16px 0 6px; color:var(--dim); font-size:9px; font-family:'JetBrains Mono',monospace; }

/* Action items */
.act-row { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:var(--card2); border-radius:6px; margin-bottom:3px; border:1px solid var(--border); cursor:pointer; transition:opacity .15s; }
.act-chk { width:18px; height:18px; border-radius:4px; border:2px solid var(--dim); background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; font-size:10px; font-weight:800; color:#000; }
.act-chk.done { background:var(--blue); border-color:var(--blue); }
.progress { height:5px; background:rgba(255,255,255,0.06); border-radius:3px; margin-bottom:14px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; transition:width .3s; }

/* Tracker */
.tracker-cols { display:flex; gap:8px; overflow-x:auto; }
.tracker-col { flex:1; min-width:160px; background:var(--card2); border-radius:8px; padding:10px; }
.tracker-card { background:var(--card); border-radius:6px; padding:8px; margin-bottom:4px; border:1px solid var(--border); cursor:pointer; }

/* Notes */
.notes-ta { width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; resize:vertical; outline:none; line-height:1.6; min-height:280px; }

/* Selected view action btns */
.sm-btn { padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; }

/* Responsive */
@media(max-width:900px) {
  .stats { grid-template-columns:repeat(3,1fr); }
  .grid4 { grid-template-columns:1fr 1fr; }
}
@media(max-width:600px) {
  .stats { grid-template-columns:repeat(2,1fr); }
  .grid4,.grid2 { grid-template-columns:1fr; }
}

/* Animate in */
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.fade-up { animation: fadeUp .25s ease both; }

/* Sync indicator */
.sync-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
.sync-bar { display:flex; align-items:center; gap:4px; font-size:9px; font-family:'JetBrains Mono',monospace; color:var(--dim); padding:4px 10px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.syncing .sync-dot { animation: pulse 1s infinite; }

/* Login screen */
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px 36px; max-width:400px; width:100%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.4); }
.login-logo { width:64px; height:64px; background:linear-gradient(135deg,var(--orange),var(--orangeL)); border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:#fff; margin:0 auto 20px; box-shadow:0 4px 20px rgba(232,119,34,0.3); }
.login-title { font-size:22px; font-weight:700; margin-bottom:4px; }
.login-sub { font-size:13px; color:var(--muted); margin-bottom:24px; }
.login-input { width:100%; padding:12px 16px; border-radius:10px; border:2px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.login-input:focus { border-color:var(--orange); }
.login-input::placeholder { color:var(--dim); }
.login-btn { width:100%; padding:12px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--orange),var(--orangeL)); color:#fff; font-size:14px; font-weight:700; cursor:pointer; margin-top:12px; transition:opacity .2s; }
.login-btn:hover { opacity:0.9; }
.login-btn:disabled { opacity:0.5; cursor:not-allowed; }
.login-err { color:var(--red); font-size:12px; margin-top:10px; min-height:18px; }
.login-lock { font-size:11px; color:var(--dim); margin-top:20px; font-family:'JetBrains Mono',monospace; }
.logout-btn { padding:4px 10px; border-radius:5px; border:1px solid rgba(248,81,73,0.3); background:rgba(248,81,73,0.08); color:var(--red); font-size:10px; font-weight:600; cursor:pointer; font-family:'JetBrains Mono',monospace; }

/* Edit forms */
.edit-input { width:100%; padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; }
.edit-input:focus { border-color:var(--orange); }
.edit-ta { width:100%; padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; resize:vertical; line-height:1.5; }
.edit-ta:focus { border-color:var(--orange); }
.edit-row { display:flex; gap:6px; margin-top:8px; }
.btn-save { padding:6px 16px; border-radius:6px; border:none; background:var(--green); color:#000; font-size:12px; font-weight:700; cursor:pointer; }
.btn-save:hover { opacity:0.9; }
.btn-cancel { padding:6px 16px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; }
.btn-add { padding:6px 14px; border-radius:6px; border:1px dashed var(--border); background:transparent; color:var(--orangeL); font-size:12px; font-weight:600; cursor:pointer; width:100%; margin-top:8px; }
.btn-add:hover { border-color:var(--orange); background:rgba(232,119,34,0.06); }
.btn-del { padding:3px 8px; border-radius:4px; border:none; background:rgba(248,81,73,0.08); color:var(--red); font-size:10px; font-weight:600; cursor:pointer; }
.btn-edit { padding:3px 8px; border-radius:4px; border:none; background:rgba(88,166,255,0.08); color:var(--blue); font-size:10px; font-weight:600; cursor:pointer; }
.edit-label { font-size:11px; font-weight:600; color:var(--muted); margin-bottom:3px; margin-top:8px; }
.edit-select { padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; }
.edit-check { margin-right:6px; accent-color:var(--orange); }
</style>

}

function showLogin(){
  document.getElementById("login").style.display = "block";
  document.getElementById("app").style.display = "none";
  const inp = document.getElementById("pw-input");
  if(inp) { inp.focus(); inp.addEventListener("keydown", function(e){ if(e.key==="Enter") attemptLogin(); }); }
}

function attemptLogin(){
  const inp = document.getElementById("pw-input");
  const err = document.getElementById("pw-err");
  const btn = document.getElementById("pw-btn");
  if(!inp) return;
  const pw = inp.value.trim();
  if(!pw){ err.textContent = "Please enter a password"; return; }
  btn.disabled = true;
  btn.textContent = "Checking...";

  if(pw === storedPassword){
    try { sessionStorage.setItem(SESSION_KEY, "ok"); } catch(e){}
    isAuthed = true;
    showDashboard();
  } else {
    err.textContent = "Incorrect password. Try again.";
    btn.disabled = false;
    btn.textContent = "Unlock Dashboard";
    inp.value = "";
    inp.focus();
  }
}

function showDashboard(){
  document.getElementById("login").style.display = "none";

  try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}

  document.getElementById("login").style.display = "block";

function initDashboard(){

// ─── STATE ───
let state={selected:new Set(),stages:{},notes:{},actionsDone:{},councilEdits:{},fSol:"all",fPri:"all",fRes:"all",search:"",view:"pipeline",activeId:null,tab:"overview",editing:null};
let saving = false;

// Load from localStorage as initial/fallback
try {
  const d = JSON.parse(localStorage.getItem(SK));
  if(d){
    if(d.selected) state.selected = new Set(d.selected);
    if(d.stages) state.stages = d.stages;
    if(d.notes) state.notes = d.notes;
    if(d.actionsDone) state.actionsDone = d.actionsDone;
    if(d.councilEdits) state.councilEdits = d.councilEdits;
  }
} catch(e){}

// Get council data merged with any edits
function getC(c){
  const e = state.councilEdits[c.id] || {};
  return {
    ...c,
    phone: e.phone || c.phone,
    email: e.email || c.email,
    approach: e.approach || c.approach,
    pitchAngle: e.pitchAngle !== undefined ? e.pitchAngle : c.pitchAngle,
    contacts: e.contacts || c.contacts,
    targets: e.targets || c.targets,
    facilities: e.facilities || c.facilities,
  };
}

function saveEdit(cid, field, value){
  if(!state.councilEdits[cid]) state.councilEdits[cid] = {};
  state.councilEdits[cid][field] = value;
  save();
}

function save(){
  try { localStorage.setItem(SK, JSON.stringify({selected:[...state.selected],stages:state.stages,notes:state.notes,actionsDone:state.actionsDone,councilEdits:state.councilEdits})); } catch(e){}

  if(!useFirebase || !dbRef) return;
  saving = true;
  syncStatus = "saving";
  renderSyncBadge();
  dbRef.set({
    selected:[...state.selected],
    stages:state.stages,
    notes:state.notes,
    actionsDone:state.actionsDone,
    councilEdits:state.councilEdits
  }).then(()=>{
    syncStatus = "live";
    saving = false;
    renderSyncBadge();
  }).catch(()=>{
    syncStatus = "offline";
    saving = false;
    renderSyncBadge();
  });
}

function renderSyncBadge(){
  const el = document.getElementById("sync-badge");
  if(!el) return;
  const colors = {live:"#3FB950",saving:"#D29922",connecting:"#58A6FF",offline:"#F85149",local:"#8B949E"};
  const labels = {live:"Live \u2022 Synced",saving:"Saving...",connecting:"Connecting...",offline:"Offline",local:"Local Only"};
  el.className = "sync-bar" + (syncStatus==="saving"?" syncing":"");
  el.innerHTML = '<span class="sync-dot" style="background:'+colors[syncStatus]+'"></span>' + labels[syncStatus];
}

// Listen for real-time changes from Firebase (if available)
if(useFirebase && dbRef) {
  dbRef.on("value", (snapshot) => {
    if(saving) return;
    const d = snapshot.val();
    if(d){
      if(d.selected) state.selected = new Set(d.selected);
      if(d.stages) state.stages = d.stages;
      if(d.notes) state.notes = d.notes;
      if(d.actionsDone) state.actionsDone = d.actionsDone;
      if(d.councilEdits) state.councilEdits = d.councilEdits;
    }
    syncStatus = "live";
    render();
  }, () => {
    syncStatus = "offline";
    renderSyncBadge();
  });
}

  const cs=selCs();

  o+=state.selected.has(ac.id)?`<button class="sm-btn" style="background:rgba(248,81,73,0.12);color:var(--red);border:1px solid rgba(248,81,73,0.3)" onclick="toggle(${ac.id})">\u2715 Remove</button>`:`<button class="sm-btn" style="background:rgba(63,185,80,0.12);color:var(--green);border:1px solid rgba(63,185,80,0.3)" onclick="toggle(${ac.id})">+ Select</button>`;
  o+=`</div>`;
  if(ac.reclassified)o+=`<div style="padding:12px;background:rgba(232,119,34,0.08);border-radius:8px;border:1px solid rgba(232,119,34,0.2);margin-bottom:12px;font-size:12px"><span style="font-weight:700;color:var(--orangeL)">\u26A0 RECLASSIFIED:</span> <span style="color:#C9D1D9">Changed from <b>${h(ac.reclassifiedFrom)}</b> \u2192 <b>${h(ac.reclassifiedTo)}</b>. Reason: ${h(ac.reclassifiedReason)}</span></div>`;
  o+=`<div style="display:flex;gap:3px;margin-bottom:12px;flex-wrap:wrap">${STAGES.map(s=>`<button class="stage-btn${stage===s.key?" on":""}" style="${stage===s.key?"border-color:"+s.color+"44;background:"+s.color+"22;color:"+s.color+";font-weight:700":""}" onclick="setStage(${ac.id},'${s.key}')">${s.icon} ${s.label}</button>`).join("")}</div>`;
  const tabs=[{k:"overview",l:"Overview"},{k:"findings",l:"Research"},{k:"docs",l:"Strategy Docs"},{k:"contacts",l:"Contacts"},{k:"pitch",l:"Sales Pitch"},{k:"cases",l:"\u{1F4CA} Case Studies"},{k:"actions",l:"Actions"},{k:"notes",l:"Notes"}];
  o+=`<div class="tabs">${tabs.map(t=>`<button class="tab${state.tab===t.k?" on":""}" onclick="setTab('${t.k}')">${t.l}</button>`).join("")}</div>`;
  o+=`<div class="card">`;
  if(state.tab==="overview") o+=renderOverview(mc,sc);
  else if(state.tab==="findings") o+=renderFindings(ac);

  else if(state.tab==="contacts") o+=renderContacts(mc);

function renderOverview(c,sc){
  const ed=state.editing;
  const eid=c.id;
  function field(lbl,key,val){
    if(ed===key) return `<div><div class="lbl">${lbl} <button class="btn-save" style="padding:2px 8px;font-size:9px" onclick="saveOverviewField(${eid},'${key}')">Save</button> <button class="btn-cancel" style="padding:2px 8px;font-size:9px" onclick="cancelEdit()">Cancel</button></div><input class="edit-input" id="edit-${key}" value="${h(val)}"></div>`;
    return `<div><div class="lbl">${lbl} <button class="btn-edit" onclick="startEdit('${key}')">\u270E</button></div><div class="val">${h(val)}</div></div>`;
  }
  let o=`<div class="grid4">${field("Phone","phone",c.phone)}${field("Email","email",c.email)}<div><div class="lbl">Region</div><div class="val">${c.region}</div></div><div><div class="lbl">Est. Facilities</div><div class="val">${c.estFacilities}</div></div><div><div class="lbl">Current Solar</div><div class="val" style="display:flex;align-items:center;gap:6px"><span class="dot" style="width:8px;height:8px;background:${dotClr(c.solarLevel)}"></span>${h(c.solar)}</div></div><div><div class="lbl">Est. Capacity</div><div class="val">${c.estKw>0?"~"+c.estKw+" kW":"None identified"}</div></div><div><div class="lbl">Solution Track</div><div class="val" style="color:${sc.text}">${sc.icon} ${sc.label}</div></div>${field("Approach","approach",c.approach)}</div>`;

  o+=`<div style="margin-top:16px"><div class="lbl">Known Facilities</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${(c.facilities||[]).map((f,i)=>`<span style="padding:4px 10px;border-radius:5px;background:rgba(255,255,255,0.06);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px">${h(f)}<button class="btn-del" style="padding:1px 4px;font-size:8px" onclick="deleteFacility(${eid},${i})">\u2715</button></span>`).join("")}</div>`;
  if(ed==="add-facility") o+=`<div style="display:flex;gap:6px;margin-top:6px"><input class="edit-input" id="edit-facility" placeholder="Facility name" style="flex:1"><button class="btn-save" onclick="saveFacility(${eid})">Add</button><button class="btn-cancel" onclick="cancelEdit()">Cancel</button></div>`;
  else o+=`<button class="btn-add" onclick="startEdit('add-facility')" style="margin-top:6px;width:auto;padding:4px 12px">+ Add Facility</button>`;
  o+=`</div>`;
  // Targets (editable)
  o+=`<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)"><div class="lbl" style="margin-bottom:8px">Published Targets</div>`;
  (c.targets||[]).forEach((t,i)=>{
    if(ed==="edit-target-"+i){
      o+=`<div style="padding:12px;background:rgba(255,255,255,0.02);border-radius:8px;margin-bottom:6px;border:1px solid var(--border)"><div class="edit-label">Target</div><input class="edit-input" id="edit-tgt-target" value="${h(t.target)}"><div class="edit-label">Deadline</div><input class="edit-input" id="edit-tgt-deadline" value="${h(t.deadline)}"><div class="edit-label">Status</div><select class="edit-select" id="edit-tgt-status"><option value="in-progress"${t.status==="in-progress"?" selected":""}>In Progress</option><option value="overdue"${t.status==="overdue"?" selected":""}>Overdue</option><option value="active"${t.status==="active"?" selected":""}>Active</option></select><div class="edit-label">Note</div><input class="edit-input" id="edit-tgt-note" value="${h(t.note||"")}"><div class="edit-row"><button class="btn-save" onclick="saveTarget(${eid},${i})">Save</button><button class="btn-cancel" onclick="cancelEdit()">Cancel</button></div></div>`;
    } else {
      o+=`<div style="padding:10px;background:${t.status==="overdue"?"rgba(248,81,73,0.06)":"rgba(255,255,255,0.02)"};border-radius:6px;margin-bottom:6px;border-left:3px solid ${statusClr(t.status)};display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="font-size:13px;font-weight:600">${h(t.target)}</div><div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap"><span style="font-size:11px;font-family:'JetBrains Mono',monospace;color:${t.status==="overdue"?"var(--red)":"var(--muted)"}">Deadline: ${t.deadline}</span><span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:${statusClr(t.status)}22;color:${statusClr(t.status)}">${t.status.toUpperCase()}</span></div>${t.note?`<div style="font-size:11px;color:var(--orangeL);margin-top:4px;font-style:italic">${h(t.note)}</div>`:""}</div><div style="display:flex;gap:4px;flex-shrink:0"><button class="btn-edit" onclick="startEdit('edit-target-${i}')">\u270E</button><button class="btn-del" onclick="deleteTarget(${eid},${i})">\u2715</button></div></div>`;
    }

  if(ed==="add-target"){
    o+=`<div style="padding:12px;background:rgba(232,119,34,0.04);border-radius:8px;margin-bottom:6px;border:1px solid rgba(232,119,34,0.15)"><div class="edit-label">Target</div><input class="edit-input" id="edit-tgt-target" placeholder="e.g. 100% renewable electricity"><div class="edit-label">Deadline</div><input class="edit-input" id="edit-tgt-deadline" placeholder="e.g. 2030"><div class="edit-label">Status</div><select class="edit-select" id="edit-tgt-status"><option value="in-progress">In Progress</option><option value="overdue">Overdue</option><option value="active">Active</option></select><div class="edit-label">Note</div><input class="edit-input" id="edit-tgt-note" placeholder="Optional note"><div class="edit-row"><button class="btn-save" onclick="saveTarget(${eid},-1)">Add Target</button><button class="btn-cancel" onclick="cancelEdit()">Cancel</button></div></div>`;
  } else {

  (c.contacts||[]).forEach((ct,i)=>{
    if(ed==="edit-contact-"+i){
      o+=`<div style="padding:12px;background:rgba(88,166,255,0.04);border-radius:8px;margin-bottom:6px;border:1px solid rgba(88,166,255,0.15)"><div class="edit-label">Role / Title</div><input class="edit-input" id="edit-ct-role" value="${h(ct.role)}"><div class="edit-label">Name</div><input class="edit-input" id="edit-ct-name" value="${h(ct.name)}"><div class="edit-label">Contact Method</div><input class="edit-input" id="edit-ct-method" value="${h(ct.method)}"><div class="edit-label">Note</div><input class="edit-input" id="edit-ct-note" value="${h(ct.note||"")}"><div style="margin-top:8px"><label style="font-size:12px;color:var(--muted);cursor:pointer"><input type="checkbox" class="edit-check" id="edit-ct-pri"${ct.priority?" checked":""}> Primary contact</label></div><div class="edit-row"><button class="btn-save" onclick="saveContact(${eid},${i})">Save</button><button class="btn-cancel" onclick="cancelEdit()">Cancel</button></div></div>`;
    } else {
      o+=`<div style="padding:12px;background:${ct.priority?"rgba(63,185,80,0.04)":"rgba(255,255,255,0.02)"};border-radius:8px;margin-bottom:6px;border:${ct.priority?"1px solid rgba(63,185,80,0.15)":"1px solid var(--border)"};display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="display:flex;align-items:center;gap:6px">${ct.priority?`<span class="tag" style="background:rgba(63,185,80,0.15);color:var(--green)">PRIMARY</span>`:""}<span style="font-size:14px;font-weight:600">${h(ct.role)}</span></div><div style="font-size:13px;margin-top:4px">${h(ct.name)}</div><div style="font-size:12px;color:var(--muted);margin-top:2px">${h(ct.method)}</div>${ct.note?`<div style="font-size:11px;color:var(--yellow);margin-top:4px;font-style:italic">${h(ct.note)}</div>`:""}</div><div style="display:flex;gap:4px;flex-shrink:0"><button class="btn-edit" onclick="startEdit('edit-contact-${i}')">\u270E</button><button class="btn-del" onclick="deleteContact(${eid},${i})">\u2715</button></div></div>`;
    }
  });
  if(ed==="add-contact"){
    o+=`<div style="padding:12px;background:rgba(232,119,34,0.04);border-radius:8px;margin-bottom:6px;border:1px solid rgba(232,119,34,0.15)"><div class="edit-label">Role / Title</div><input class="edit-input" id="edit-ct-role" placeholder="e.g. Sustainability Officer"><div class="edit-label">Name</div><input class="edit-input" id="edit-ct-name" placeholder="e.g. Jane Smith"><div class="edit-label">Contact Method</div><input class="edit-input" id="edit-ct-method" placeholder="e.g. Email, phone number"><div class="edit-label">Note</div><input class="edit-input" id="edit-ct-note" placeholder="Optional note"><div style="margin-top:8px"><label style="font-size:12px;color:var(--muted);cursor:pointer"><input type="checkbox" class="edit-check" id="edit-ct-pri"> Primary contact</label></div><div class="edit-row"><button class="btn-save" onclick="saveContact(${eid},-1)">Add Contact</button><button class="btn-cancel" onclick="cancelEdit()">Cancel</button></div></div>`;
  } else {
    o+=`<button class="btn-add" onclick="startEdit('add-contact')">+ Add Contact</button>`;
  }
  o+=`<div style="margin-top:12px;padding:12px;background:rgba(88,166,255,0.06);border-radius:8px;border:1px solid rgba(88,166,255,0.12)"><div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px">General Contact</div><div style="font-size:13px">Phone: ${h(c.phone)}</div><div style="font-size:13px">Email: ${h(c.email)}</div></div>`;
  return o;
}

function renderPitch(c,sc){
  const ed=state.editing, eid=c.id;
  const qs=c.solution==="droplet"?["How many facilities have solar, and what are the total capacities?","What inverter brands and models are installed?","Do you have any monitoring or energy management platform?","What % of solar is being exported vs self-consumed?","Have you explored energy sharing between buildings?","What are your top 3 energy priorities for the next 12 months?"]:c.solution==="hybrid"?["Which facilities currently have solar, and what sizes?","What inverter brands are installed?","Which facilities without solar have the highest energy bills?","What\u2019s your annual energy spend across all facilities?","Are you satisfied with your existing solar performance?","What sustainability targets has council committed to?"]:["What are your current annual electricity costs across all facilities?","Which facilities have the highest energy consumption?","Has council set specific renewable energy / net-zero targets?","Are there any existing solar installations we should know about?","What is your procurement process for this value range?","Are you pursuing any state or federal grant opportunities?"];
  let o=`<div style="padding:16px;background:${sc.bg};border-radius:10px;border:1px solid ${sc.border};margin-bottom:20px"><div style="font-size:20px;font-weight:700;color:${sc.text}">Pitch for ${h(c.name)}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${sc.icon} ${sc.label} \u2014 powered by Noor Energy \u00D7 SwitchDin</div></div>`;
  // Editable pitch angle
  o+=`<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">Recommended Pitch Angle `;
  if(ed==="pitch"){
    o+=`</div><textarea class="edit-ta" id="edit-pitch" rows="5">${h(c.pitchAngle||"")}</textarea><div class="edit-row"><button class="btn-save" onclick="savePitch(${eid})">Save Pitch</button><button class="btn-cancel" onclick="cancelEdit()">Cancel</button></div></div>`;
  } else {
    o+=`<button class="btn-edit" onclick="startEdit('pitch')">\u270E Edit</button></div>`;
    if(c.pitchAngle) o+=`<div style="padding:14px;background:rgba(0,0,0,0.15);border-radius:8px;font-size:13px;color:#C9D1D9;line-height:1.6;font-style:italic;border-left:3px solid ${sc.text}">${h(c.pitchAngle)}</div>`;
    else o+=`<div style="padding:14px;background:rgba(255,255,255,0.02);border-radius:8px;font-size:13px;color:var(--dim);font-style:italic">No pitch written yet. Click Edit to add one.</div>`;
    o+=`</div>`;
  }
  if((c.targets||[]).length){o+=`<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">Their Published Targets \u2014 Reference These</div>`;c.targets.forEach(t=>{o+=`<div style="padding:10px;margin-bottom:4px;border-radius:6px;background:${t.status==="overdue"?"rgba(248,81,73,0.06)":"rgba(255,255,255,0.02)"};border-left:3px solid ${t.status==="overdue"?"var(--red)":"var(--yellow)"}"><div style="font-size:13px;font-weight:600">${h(t.target)} \u2014 by ${t.deadline}</div>${t.note?`<div style="font-size:11px;color:var(--orangeL);margin-top:2px">${h(t.note)}</div>`:""}</div>`;});o+=`</div>`;}
  o+=`<div style="margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">Discovery Questions \u2014 Ask in First Meeting</div>${qs.map((q,i)=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:rgba(88,166,255,0.04);border-radius:6px;margin-bottom:4px;border:1px solid rgba(88,166,255,0.08)"><span style="color:var(--blue);font-weight:700;font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0">Q${i+1}</span><span style="font-size:13px">${h(q)}</span></div>`).join("")}</div>`;
  o+=`<div style="padding:14px;background:rgba(0,180,160,0.06);border-radius:8px;border:1px solid rgba(0,180,160,0.12)"><div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:6px">\u{1F3C6} Proven Council Results \u2014 Reference in Meeting</div><div style="font-size:12px;color:var(--muted);line-height:1.7"><b style="color:var(--orangeL)">City of Yarra (VIC):</b> 1,117 kW solar across 48 buildings, 507 kWh battery at 11 sites. SwitchDin optimisation delivered up to 91% energy cost reduction and 23% faster payback. Secured $398K government grant.<br><br><b style="color:var(--blue)">Newcastle City Council (NSW):</b> 11 sites, 400+ kW solar. $230K/year savings. Unified monitoring across multiple vendors via Stormcloud.<br><br><b style="color:var(--green)">Lake Macquarie (NSW):</b> EV charging + solar/battery coordination. Zero site trips, $5.5K/yr demand charge savings. 5 different OEM systems unified under SwitchDin.<br><br><em>Perth\u2019s 35% higher solar yield means ${h(c.name)} will see even better results than these east coast councils. See the Case Studies tab for full details.</em></div></div>`;
  return o;
}

function renderActions(c,actions,stage,stObj){
  const doneCount=actions.filter((_,i)=>state.actionsDone[c.id+"-"+stage+"-"+i]).length;
  const pct=Math.round(doneCount/actions.length*100);
  let o=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-size:15px;font-weight:700">${stObj.icon} ${stObj.label} Stage Actions</div><div style="font-size:12px;color:var(--muted);margin-top:2px">Complete before moving to next stage</div></div><div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${stObj.color}">${doneCount}/${actions.length}</div></div><div class="progress"><div class="progress-fill" style="background:${stObj.color};width:${pct}%"></div></div>`;
  actions.forEach((a,i)=>{const done=state.actionsDone[c.id+"-"+stage+"-"+i];o+=`<div class="act-row" style="opacity:${done?0.5:1}" onclick="toggleAct(${c.id},${i})"><div class="act-chk${done?" done":""}" style="${done?"background:"+stObj.color+";border-color:"+stObj.color:""}">${done?"\u2713":""}</div><span style="text-decoration:${done?"line-through":"none"};font-size:13px;line-height:1.4">${h(a.text)}</span></div>`;});
  return o;
}

function renderNotes(c){
  return`<div style="font-size:15px;font-weight:700;margin-bottom:4px">Notes for ${h(c.name)}</div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">Meeting notes, follow-ups, contact details \u2014 synced live across all devices</div><textarea class="notes-ta" id="notes-ta" placeholder="Add notes about ${h(c.name)}...">${h(state.notes[c.id]||"")}</textarea>`;
}

function renderCaseStudies(c){
  const cs = [
    {
      title: "City of Yarra \u2014 Community Solar VPP",
      location: "Victoria",
      type: "Solar + Battery + VPP Optimisation",
      color: "#E87722",
      stats: [
        {label:"Solar PV Installed", value:"1,117 kW across 48 buildings"},
        {label:"Battery Storage", value:"507 kWh at 11 sites"},
        {label:"Energy Cost Reduction", value:"Up to 91%"},
        {label:"Payback Improvement", value:"23% shorter"},
        {label:"Grant Secured", value:"$398K (DEECA) + $44K council"},
        {label:"Pilot Sites", value:"4 community facilities"}
      ],
      sites: "Alphington Pavilion (28kW/86kWh), Fairfield Park Pavilion (42kW/86kWh), Fairlea Reserve Netball Complex (64.5kW/130kWh), Mark Street Hall (28kW/86kWh)",
      challenge: "Grid export limits imposed by distribution network. Council needed to maximise value from solar through wholesale energy arbitrage while reducing energy costs across facilities.",
      solution: "SwitchDin Stormcloud + Droplet edge controllers deployed at 4 sites. Real-time optimisation: charges batteries during low prices/excess solar, discharges during peak, regulates export to comply with DNSP limits. Autonomous operation even if internet lost.",
      result: "91% energy cost reduction vs no-solar baseline. 23% faster payback on investment. Scalable model for entire council portfolio.",
      quote: "Community batteries drive down costs and empower the community to take ownership of their energy use.",
      quoteBy: "Stephen Jolly, Mayor of Yarra",
      relevance_full: "This is the blueprint. Yarra went from individual solar systems to a coordinated VPP across council buildings. Same approach works for any Perth council starting fresh.",
      relevance_hybrid: "Yarra already had solar on 48 buildings but they were working independently. SwitchDin connected them. Same opportunity exists wherever a council has scattered solar.",
      relevance_droplet: "Yarra proves the VPP retrofit model. Existing solar + new Droplets + Stormcloud = coordinated energy network with massive cost savings."
    },
    {
      title: "Newcastle City Council \u2014 Distributed Solar Portfolio",
      location: "NSW",
      type: "Multi-site Solar Monitoring & Management",
      color: "#58A6FF",
      stats: [
        {label:"Sites Managed", value:"11 council facilities"},
        {label:"Solar Capacity", value:"400+ kW"},
        {label:"Annual Savings", value:"~$230,000/year"},
        {label:"Net Zero Target", value:"2030"},
        {label:"Electricity Reduction", value:"20% vs FY2019/20"},
        {label:"Solar Farm", value:"5MW at Summerhill"}
      ],
      sites: "City Library, City Admin Centre, Newcastle Museum, No.2 Sportsgrounds + 7 more",
      challenge: "Multiple solar/battery/EV assets installed over years from different vendors (SolarEdge, SMA, Victron, Schneider, Enphase). Each had separate dashboards. Consolidating data was time-consuming and resource-intensive for staff.",
      solution: "SwitchDin Droplet controllers as communication gateways + Stormcloud platform for unified monitoring. Vendor-agnostic integration across all device brands. Custom dashboards aggregate all 11 sites into a single view.",
      result: "$230K annual energy bill reduction. Unified real-time monitoring eliminated manual data collection. Council can now identify underperforming assets, track portfolio performance, and report solar offset vs grid.",
      quote: "Through these renewable projects we also hope to inspire Newcastle residents to adopt clean, affordable energy in their own homes and help build a more resilient city.",
      quoteBy: "NCC Sustainability Team",
      relevance_full: "Newcastle built from scratch across 11 sites over several years. Shows SwitchDin scales as you grow. Start with a few buildings, expand over time.",
      relevance_hybrid: "Newcastle had the exact same problem Perth councils face: solar from multiple vendors with no unified view. SwitchDin solved this with one platform.",
      relevance_droplet: "Perfect example of retrofitting Droplets onto existing multi-vendor solar. No rip-and-replace, just add the SwitchDin layer on top."
    },
    {
      title: "Lake Macquarie City Council \u2014 EV Charging + Solar",
      location: "NSW",
      type: "EV Charging with Solar/Battery Coordination",
      color: "#3FB950",
      stats: [
        {label:"EV Charger", value:"50kW DC fast charger"},
        {label:"Demand Cap", value:"Kept at 20kW during 50kW charge"},
        {label:"Annual Savings", value:"~$5,500/year (demand charges)"},
        {label:"Site Trips", value:"Zero overcurrent events"},
        {label:"OEM Integration", value:"5 different vendors"},
        {label:"Reliability", value:">200,000 hrs MTBF"}
      ],
      sites: "Swansea Multipurpose Centre and Library",
      challenge: "Limited grid connection at the site. Fast EV charging risked exceeding supply capacity and triggering expensive demand charges. Equipment from 5 different manufacturers (SolarEdge, SMA, Orion, LC Energy, EDMI) needed unified control.",
      solution: "SwitchDin Droplet orchestrates solar PV, battery storage, and EV charger in real-time. Sub-second control algorithms balance cost optimisation with power stability. Battery pre-charges from solar, then supports EV charging to cap grid demand.",
      result: "Zero site trips during EV charging. Demand capped at 20kW even during 50kW charging. $5,500/year saved on demand charges alone. Stable, reliable public EV charging.",
      quote: "",
      quoteBy: "",
      relevance_full: "Shows SwitchDin handles EV charging integration too. As councils electrify fleets, this capability becomes critical. Future-proofs the investment.",
      relevance_hybrid: "Demonstrates how SwitchDin coordinates multiple device types from different vendors at a single site. Exact same challenge Perth councils face.",
      relevance_droplet: "Proves the Droplet can manage complex multi-vendor sites with sub-second control. Even constrained grid connections become manageable."
    }
  ];

  let o = `<div style="margin-bottom:16px"><div style="font-size:18px;font-weight:700;margin-bottom:4px">SwitchDin Council Case Studies</div><div style="font-size:12px;color:var(--muted)">Use these as reference material in meetings and proposals for ${h(c.name)}</div></div>`;

  cs.forEach(s => {
    const rel = c.solution==="full" ? s.relevance_full : c.solution==="hybrid" ? s.relevance_hybrid : s.relevance_droplet;
    o += `<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;border-top:3px solid ${s.color}">`;
    // Header
    o += `<div style="padding:14px 16px;background:rgba(255,255,255,0.02)"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><div style="font-size:16px;font-weight:700;color:${s.color}">${s.title}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${s.location} \u2022 ${s.type}</div></div></div></div>`;
    // Stats grid
    o += `<div style="padding:0 16px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">`;
    s.stats.forEach(st => {
      o += `<div style="padding:8px 10px;background:var(--bg);border-radius:6px;border:1px solid var(--border)"><div style="font-size:8px;font-family:'JetBrains Mono',monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:2px">${st.label}</div><div style="font-size:13px;font-weight:600">${st.value}</div></div>`;
    });
    o += `</div>`;
    // Sites
    o += `<div style="padding:0 16px 12px"><div style="font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:4px">Sites</div><div style="font-size:12px;color:var(--muted)">${h(s.sites)}</div></div>`;
    // Challenge > Solution > Result
    o += `<div style="padding:0 16px 12px"><div style="padding:10px;background:rgba(248,81,73,0.04);border-radius:6px;margin-bottom:6px;border-left:3px solid var(--red)"><div style="font-size:10px;font-weight:700;color:var(--red);margin-bottom:3px">CHALLENGE</div><div style="font-size:12px;line-height:1.5">${h(s.challenge)}</div></div>`;
    o += `<div style="padding:10px;background:rgba(88,166,255,0.04);border-radius:6px;margin-bottom:6px;border-left:3px solid var(--blue)"><div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:3px">SOLUTION</div><div style="font-size:12px;line-height:1.5">${h(s.solution)}</div></div>`;
    o += `<div style="padding:10px;background:rgba(63,185,80,0.04);border-radius:6px;margin-bottom:6px;border-left:3px solid var(--green)"><div style="font-size:10px;font-weight:700;color:var(--green);margin-bottom:3px">RESULT</div><div style="font-size:12px;line-height:1.5">${h(s.result)}</div></div></div>`;
    // Quote
    if(s.quote){
      o += `<div style="padding:0 16px 12px"><div style="padding:12px 14px;background:rgba(255,255,255,0.02);border-radius:8px;border-left:3px solid ${s.color}"><div style="font-size:12px;font-style:italic;color:#C9D1D9;line-height:1.5">\u201C${h(s.quote)}\u201D</div><div style="font-size:11px;color:var(--dim);margin-top:6px">\u2014 ${h(s.quoteBy)}</div></div></div>`;
    }
    // Relevance to THIS council
    o += `<div style="padding:0 16px 14px"><div style="padding:10px 12px;background:rgba(232,119,34,0.06);border-radius:8px;border:1px solid rgba(232,119,34,0.15)"><div style="font-size:10px;font-weight:700;color:var(--orangeL);margin-bottom:3px">\u{1F3AF} WHY THIS MATTERS FOR ${c.name.toUpperCase()}</div><div style="font-size:12px;line-height:1.5;color:#C9D1D9">${h(rel)}</div></div></div>`;
    o += `</div>`;
  });

  // How to use section
  o += `<div style="margin-top:8px;padding:14px;background:rgba(0,180,160,0.06);border-radius:8px;border:1px solid rgba(0,180,160,0.12)"><div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:6px">\u{1F4A1} How to Use These in Your Pitch</div><div style="font-size:12px;color:var(--muted);line-height:1.7">Open with City of Yarra as the headline \u2014 it is the closest model to what you are proposing for Perth councils. Use Newcastle to show scale and long-term value ($230K/yr savings across 11 sites). Bring in Lake Macquarie if the council mentions EV charging or fleet electrification plans. Always tailor the relevance to their specific situation \u2014 the council-specific angle is shown above each case study. Perth has 35% higher solar yield than Melbourne, so Yarra results are a conservative baseline for WA councils.</div></div>`;
  return o;
}

function wireDetail(ac){
  const ta=document.getElementById("notes-ta");
  if(ta)ta.addEventListener("input",function(){setNote(ac.id,this.value);});
}
function wireMain(){}

render();
} // end initDashboard
</script>
